name: refresh profile stats

# The ghost card is a PNG and the README embeds numbers, so both go stale on their
# own. This rebuilds them daily, runs the same gates as tools/verify.sh, and only
# commits when something actually changed. Daily also means a widget service dying
# is caught within a day instead of sitting broken for a week.

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install the only build dependency
        shell: bash
        run: python -m pip install --quiet pillow

      - name: rebuild the card and README
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/build-card.py
          python tools/build-readme.py

      - name: gate - every badge and widget must resolve
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/check-readme-links.py
          python tools/render-check.py

      - name: commit if anything changed
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- README.md assets/profile-card.png; then
            echo "nothing changed"
          else
            git add README.md assets/profile-card.png
            git commit -m "Refresh profile stats [skip ci]"
            git push
          fi
