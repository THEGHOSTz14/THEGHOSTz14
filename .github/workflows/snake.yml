name: github snake

on:
  schedule:
    - cron: "24 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: snake
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: render snake over the contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            dist/github-snake-dark.svg?palette=github-dark&color_dots=#1b2028,#10612b,#19a049,#3fd06a,#7ee787

      - name: publish it on the github-snake branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: github-snake
          build_dir: dist
          keep_files: false
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
