name: github snake

on:
  schedule:
    - cron: "24 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: snake
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: render snake over the contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#1a1a1a&color_dots=#ebedf0,#cfcfcf,#9a9a9a,#5e5e5e,#242424
            dist/github-snake-dark.svg?color_snake=#f0f0f0&color_dots=#161616,#3a3a3a,#6e6e6e,#a8a8a8,#e6e6e6

      - name: publish it on the github-snake branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: github-snake
          build_dir: dist
          keep_files: false
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
