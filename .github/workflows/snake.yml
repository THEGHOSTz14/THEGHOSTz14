name: github snake

on:
  schedule:
    - cron: "24 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: snake
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: render snake over the contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#b31217&color_dots=#ebedf0,#f3c9c4,#d9534f,#b31217,#7a0c10
            dist/github-snake-dark.svg?color_snake=#e0533d&color_dots=#1a1212,#4d1113,#8b1a1a,#b31217,#e0533d

      - name: publish it on the github-snake branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: github-snake
          build_dir: dist
          keep_files: false
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
