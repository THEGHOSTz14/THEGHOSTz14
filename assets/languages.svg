<svg xmlns="http://www.w3.org/2000/svg" width="340" height="150" viewBox="0 0 340 150" role="img" aria-label="Most used languages">
<!-- c4 -->
<style>
  .glow { animation: sweep 4.6s linear infinite; }
  @keyframes sweep { 0% { transform: translateX(-80px); } 100% { transform: translateX(360px); } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#14150f"/><stop offset="1" stop-color="#0a0b07"/>
  </linearGradient>
  <clipPath id="bar"><rect x="20" y="42" width="300" height="10" rx="5"/></clipPath>
</defs>
<rect x="0.5" y="0.5" width="339" height="149" rx="14" fill="url(#bg)" stroke="#2a2b21"/>
<text x="20" y="26" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3">Most used languages</text>
<rect x="20" y="42" width="300" height="10" rx="5" fill="#20211a"/>
<g clip-path="url(#bar)">
<rect x="20.0" y="42" width="117.8" height="10" fill="#355570" stroke="#0b0c07" stroke-width="1"/>
<rect x="137.8" y="42" width="90.6" height="10" fill="#3178C6" stroke="#0b0c07" stroke-width="1"/>
<rect x="228.4" y="42" width="55.8" height="10" fill="#3572A5" stroke="#0b0c07" stroke-width="1"/>
<rect x="284.1" y="42" width="20.0" height="10" fill="#178600" stroke="#0b0c07" stroke-width="1"/>
<rect x="304.1" y="42" width="6.2" height="10" fill="#E34C26" stroke="#0b0c07" stroke-width="1"/>
<rect x="310.4" y="42" width="9.6" height="10" fill="#DB61A2" stroke="#0b0c07" stroke-width="1"/>
  <rect class="glow" x="20" y="42" width="44" height="10" fill="#ffffff" opacity=".22"/>
</g>
<circle cx="24" cy="74" r="4" fill="#355570"/><text x="34" y="78" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#a6afbd">GDScript <tspan fill="#6e7681">39%</tspan></text>
<circle cx="24" cy="98" r="4" fill="#3178C6"/><text x="34" y="102" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#a6afbd">TypeScript <tspan fill="#6e7681">30%</tspan></text>
