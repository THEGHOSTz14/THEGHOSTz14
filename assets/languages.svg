<circle cx="184" cy="74" r="4" fill="#178600"/><text x="194" y="78" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#a6afbd">C# <tspan fill="#6e7681">7%</tspan></text>
