<svg xmlns="http://www.w3.org/2000/svg" width="340" height="150" viewBox="0 0 340 150" role="img" aria-label="Most used languages">
<!-- c3 -->
<style>
  .glow { animation: glow 4.6s ease-in-out infinite; }
  @keyframes glow { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#14150f"/><stop offset="1" stop-color="#0a0b07"/>
  </linearGradient>
  <clipPath id="bar"><rect x="20" y="42" width="300" height="10" rx="5"/></clipPath>
</defs>
<rect x="0.5" y="0.5" width="339" height="149" rx="14" fill="url(#bg)" stroke="#2a2b21"/>
<text x="20" y="26" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3">Most used languages</text>
<rect x="20" y="42" width="300" height="10" rx="5" fill="#20211a"/>
<g clip-path="url(#bar)">
<rect x="20.0" y="42" width="122.2" height="10" fill="#355570"/>
<rect x="142.2" y="42" width="93.9" height="10" fill="#3178C6"/>
<rect x="236.1" y="42" width="46.7" height="10" fill="#3572A5"/>
<rect x="282.8" y="42" width="20.8" height="10" fill="#178600"/>
<rect x="303.5" y="42" width="6.4" height="10" fill="#E34C26"/>
<rect x="310.0" y="42" width="10.0" height="10" fill="#DB61A2"/>
  <rect class="glow" x="0" y="42" width="340" height="10" fill="#ffffff" opacity=".12"/>
</g>
<circle cx="24" cy="74" r="4" fill="#355570"/><text x="34" y="78" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#a6afbd">GDScript <tspan fill="#6e7681">41%</tspan></text>
<circle cx="24" cy="98" r="4" fill="#3178C6"/><text x="34" y="102" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#a6afbd">TypeScript <tspan fill="#6e7681">31%</tspan></text>
<circle cx="24" cy="122" r="4" fill="#3572A5"/><text x="34" y="126" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#a6afbd">Python <tspan fill="#6e7681">16%</tspan></text>
<circle cx="184" cy="74" r="4" fill="#178600"/><text x="194" y="78" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#a6afbd">C# <tspan fill="#6e7681">7%</tspan></text>
<circle cx="184" cy="98" r="4" fill="#E34C26"/><text x="194" y="102" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#a6afbd">HTML <tspan fill="#6e7681">2%</tspan></text>
<circle cx="184" cy="122" r="4" fill="#DB61A2"/><text x="194" y="126" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#a6afbd">other <tspan fill="#6e7681">3%</tspan></text>
</svg>
