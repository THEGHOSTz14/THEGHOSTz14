<svg xmlns="http://www.w3.org/2000/svg" width="96" height="118" viewBox="0 0 96 118" role="img" aria-label="Unreal Engine">
<!-- t5 -->
<style>
  .float { animation: float 6.4s ease-in-out infinite; animation-delay: -6.50s; }
  .spin { transform-box: fill-box; transform-origin: 50% 50%; animation: spin 10s cubic-bezier(.6,.05,.4,.95) infinite; animation-delay: -6.50s; }
  .gleam { animation: gleam 10s ease-in-out infinite; animation-delay: -6.50s; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
  @keyframes spin {
    0%, 60% { transform: perspective(190px) rotateY(0deg); opacity: 1; }
    64% { transform: perspective(190px) rotateY(90deg); opacity: .3; }
    68% { transform: perspective(190px) rotateY(180deg); opacity: .14; }
    72% { transform: perspective(190px) rotateY(270deg); opacity: .3; }
    76%, 100% { transform: perspective(190px) rotateY(360deg); opacity: 1; }
  }
  @keyframes gleam { 0%, 34% { transform: translateX(-70px); } 58%, 100% { transform: translateX(130px); } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#25261d"/><stop offset="1" stop-color="#0d0e09"/>
  </linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="clip"><rect x="0" y="0" width="96" height="96" rx="22"/></clipPath>
</defs>
<rect x="0.5" y="0.5" width="95" height="95" rx="21.5" fill="url(#bg)" stroke="#34352a"/>
<g clip-path="url(#clip)">
  <rect x="1" y="1" width="94" height="46" rx="20" fill="url(#sheen)"/>
  <rect x="1" y="52" width="94" height="43" rx="18" fill="#000000" opacity=".22"/>
  <g transform="rotate(16 48 48)"><rect class="gleam" x="-46" y="-40" width="18" height="180" fill="#ffffff" opacity=".09"/></g>
  <g class="float"><g class="spin"><g transform="translate(22 22) scale(2.1667)" fill="#FFFFFF"><path d="M12 0a12 12 0 1012 12A12 12 0 0012 0zm0 23.52A11.52 11.52 0 1123.52 12 11.52 11.52 0 0112 23.52zm7.13-9.791c-.206.997-1.126 3.557-4.06 4.942l-1.179-1.325-1.988 2a7.338 7.338 0 01-5.804-2.978 2.859 2.859 0 00.65.123c.326.006.678-.114.678-.66v-5.394a.89.89 0 00-1.116-.89c-.92.212-1.656 2.509-1.656 2.509a7.304 7.304 0 012.528-5.597 7.408 7.408 0 013.73-1.721c-1.006.573-1.57 1.507-1.57 2.29 0 1.262.76 1.109.984.923v7.28a1.157 1.157 0 00.148.256 1.075 1.075 0 00.88.445c.76 0 1.747-.868 1.747-.868V9.172c0-.6-.452-1.324-.905-1.572 0 0 .838-.149 1.484.346a5.537 5.537 0 01.387-.425c1.508-1.48 2.929-1.902 4.112-2.112 0 0-2.151 1.69-2.151 3.96 0 1.687.043 5.801.043 5.801.799.771 1.986-.342 3.059-1.441Z"/></g></g></g>
</g>
<rect x="0.5" y="0.5" width="95" height="95" rx="21.5" fill="none" stroke="#eaf3ff" stroke-opacity=".07"/>
<text x="48" y="112" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9aa4b4">Unreal Engine</text>
