<svg xmlns="http://www.w3.org/2000/svg" width="96" height="118" viewBox="0 0 96 118" role="img" aria-label="PyTorch">
<!-- t4 -->
<style>
  .bob { animation: bob 5.6s ease-in-out infinite; animation-delay: 4.94s; }
  .flip { transform-box: fill-box; transform-origin: 50% 50%; animation: flip 7.2s cubic-bezier(.45,.05,.3,1) infinite; animation-delay: 4.94s; }
  .gleam { animation: gleam 7.2s ease-in-out infinite; animation-delay: 4.94s; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }
  @keyframes flip { 0%, 60% { transform: scaleX(1); } 72% { transform: scaleX(.06); } 84%, 100% { transform: scaleX(1); } }
  @keyframes gleam { 0%, 55% { transform: translateX(-70px); } 80%, 100% { transform: translateX(130px); } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#25261d"/><stop offset="1" stop-color="#0d0e09"/>
  </linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="clip"><rect x="0" y="0" width="96" height="96" rx="22"/></clipPath>
</defs>
<g class="bob"><g class="flip">
  <rect x="0.5" y="0.5" width="95" height="95" rx="21.5" fill="url(#bg)" stroke="#34352a"/>
  <g clip-path="url(#clip)">
    <rect x="1" y="1" width="94" height="46" rx="20" fill="url(#sheen)"/>
    <rect x="1" y="52" width="94" height="43" rx="18" fill="#000000" opacity=".22"/>
    <g transform="rotate(16 48 48)"><rect class="gleam" x="-46" y="-40" width="18" height="180" fill="#ffffff" opacity=".09"/></g>
    <g transform="translate(22 22) scale(2.1667)" fill="#EE4C2C"><path d="M12.005 0L4.952 7.053a9.865 9.865 0 000 14.022 9.866 9.866 0 0014.022 0c3.984-3.9 3.986-10.205.085-14.023l-1.744 1.743c2.904 2.905 2.904 7.634 0 10.538s-7.634 2.904-10.538 0-2.904-7.634 0-10.538l4.647-4.646.582-.665zm3.568 3.899a1.327 1.327 0 00-1.327 1.327 1.327 1.327 0 001.327 1.328A1.327 1.327 0 0016.9 5.226 1.327 1.327 0 0015.573 3.9z"/></g>
  </g>
  <rect x="0.5" y="0.5" width="95" height="95" rx="21.5" fill="none" stroke="#eaf3ff" stroke-opacity=".07"/>
</g></g>
<text x="48" y="112" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9aa4b4">PyTorch</text>
</svg>
