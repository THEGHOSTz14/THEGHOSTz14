<!-- t4 -->
<style>
  .bob { animation: bob 5.6s ease-in-out infinite; animation-delay: 5.69s; }
  .flip { transform-box: fill-box; transform-origin: 50% 50%; animation: flip 7.2s cubic-bezier(.45,.05,.3,1) infinite; animation-delay: 5.69s; }
  .gleam { animation: gleam 7.2s ease-in-out infinite; animation-delay: 5.69s; }
