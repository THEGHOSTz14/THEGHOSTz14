<svg xmlns="http://www.w3.org/2000/svg" width="96" height="118" viewBox="0 0 96 118" role="img" aria-label="Ansible">
<!-- t7 -->
<style>
  .float { animation: float 6.4s ease-in-out infinite; animation-delay: -8.20s; }
  .spin { transform-box: fill-box; transform-origin: 50% 50%; animation: spin 10s linear infinite; animation-delay: -8.20s; }
  .gleam { animation: gleam 10s ease-in-out infinite; animation-delay: -8.20s; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
  @keyframes spin {
    0%, 58% { transform: perspective(190px) rotateY(0deg); opacity: 1; }
    61% { transform: perspective(190px) rotateY(45deg); opacity: .8; }
    62.5% { transform: perspective(190px) rotateY(90deg); opacity: 0; }
    64% { transform: perspective(190px) rotateY(270deg); opacity: 0; }
    66% { transform: perspective(190px) rotateY(315deg); opacity: .7; }
    69%, 100% { transform: perspective(190px) rotateY(360deg); opacity: 1; }
  }
  @keyframes gleam { 0%, 34% { transform: translateX(-70px); } 58%, 100% { transform: translateX(130px); } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#25261d"/><stop offset="1" stop-color="#0d0e09"/>
  </linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="clip"><rect x="0" y="0" width="96" height="96" rx="22"/></clipPath>
</defs>
<rect x="0.5" y="0.5" width="95" height="95" rx="21.5" fill="url(#bg)" stroke="#34352a"/>
<g clip-path="url(#clip)">
  <rect x="1" y="1" width="94" height="46" rx="20" fill="url(#sheen)"/>
  <rect x="1" y="52" width="94" height="43" rx="18" fill="#000000" opacity=".22"/>
  <g transform="rotate(16 48 48)"><rect class="gleam" x="-46" y="-40" width="18" height="180" fill="#ffffff" opacity=".09"/></g>
  <g class="float"><g class="spin"><g transform="translate(22 22) scale(2.1667)" fill="#F23F3F"><path d="M10.617 11.473l4.686 3.695-3.102-7.662zM12 0C5.371 0 0 5.371 0 12s5.371 12 12 12 12-5.371 12-12S18.629 0 12 0zm5.797 17.305c-.011.471-.403.842-.875.83-.236 0-.416-.09-.664-.293l-6.19-5-2.079 5.203H6.191L11.438 5.44c.124-.314.427-.52.764-.506.326-.014.63.189.742.506l4.774 11.494c.045.111.08.234.08.348-.001.009-.001.009-.001.023z"/></g></g></g>
</g>
<rect x="0.5" y="0.5" width="95" height="95" rx="21.5" fill="none" stroke="#eaf3ff" stroke-opacity=".07"/>
<text x="48" y="112" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9aa4b4">Ansible</text>
</svg>
