<svg xmlns="http://www.w3.org/2000/svg" width="96" height="118" viewBox="0 0 96 118" role="img" aria-label="Rider">
<!-- t5 -->
<style>
  .float { animation: float 6.4s ease-in-out infinite; animation-delay: -2.20s; }
  .spin { transform-box: fill-box; transform-origin: 50% 50%; animation: spin 10s cubic-bezier(.6,.05,.4,.95) infinite; animation-delay: -2.20s; }
  .gleam { animation: gleam 10s ease-in-out infinite; animation-delay: -2.20s; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
  @keyframes spin {
    0%, 60% { transform: perspective(190px) rotateY(0deg); opacity: 1; }
    64% { transform: perspective(190px) rotateY(90deg); opacity: .3; }
    68% { transform: perspective(190px) rotateY(180deg); opacity: .14; }
    72% { transform: perspective(190px) rotateY(270deg); opacity: .3; }
    76%, 100% { transform: perspective(190px) rotateY(360deg); opacity: 1; }
  }
  @keyframes gleam { 0%, 34% { transform: translateX(-70px); } 58%, 100% { transform: translateX(130px); } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#25261d"/><stop offset="1" stop-color="#0d0e09"/>
  </linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="clip"><rect x="0" y="0" width="96" height="96" rx="22"/></clipPath>
</defs>
<rect x="0.5" y="0.5" width="95" height="95" rx="21.5" fill="url(#bg)" stroke="#34352a"/>
<g clip-path="url(#clip)">
  <rect x="1" y="1" width="94" height="46" rx="20" fill="url(#sheen)"/>
  <rect x="1" y="52" width="94" height="43" rx="18" fill="#000000" opacity=".22"/>
  <g transform="rotate(16 48 48)"><rect class="gleam" x="-46" y="-40" width="18" height="180" fill="#ffffff" opacity=".09"/></g>
  <g class="float"><g class="spin"><g transform="translate(22 22) scale(2.1667)" fill="#FCA326"><path d="M0 0v24h24V0zm7.031 3.113A4.063 4.063 0 0 1 9.72 4.14a3.23 3.23 0 0 1 .84 2.28A3.16 3.16 0 0 1 8.4 9.54l2.46 3.6H8.28L6.12 9.9H4.38v3.24H2.16V3.12c1.61-.004 3.281.009 4.871-.007zm5.509.007h3.96c3.18 0 5.34 2.16 5.34 5.04 0 2.82-2.16 5.04-5.34 5.04h-3.96zm4.069 1.976c-.607.01-1.235.004-1.849.004v6.06h1.74a2.882 2.882 0 0 0 3.06-3 2.897 2.897 0 0 0-2.951-3.064zM4.319 5.1v2.88H6.6c1.08 0 1.68-.6 1.68-1.44 0-.96-.66-1.44-1.74-1.44zM2.16 19.5h9V21h-9Z"/></g></g></g>
</g>
<rect x="0.5" y="0.5" width="95" height="95" rx="21.5" fill="none" stroke="#eaf3ff" stroke-opacity=".07"/>
<text x="48" y="112" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9aa4b4">Rider</text>
</svg>
