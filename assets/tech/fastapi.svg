<svg xmlns="http://www.w3.org/2000/svg" width="96" height="118" viewBox="0 0 96 118" role="img" aria-label="FastAPI">
<!-- t6 -->
<style>
  .float { animation: float 6.4s ease-in-out infinite; animation-delay: -6.10s; }
  .spin { transform-box: fill-box; transform-origin: 50% 50%; animation: spin 10s linear infinite; animation-delay: -6.10s; }
  .gleam { animation: gleam 10s ease-in-out infinite; animation-delay: -6.10s; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
  @keyframes spin {
    0%, 58% { transform: perspective(190px) rotateY(0deg); opacity: 1; }
    61% { transform: perspective(190px) rotateY(45deg); opacity: .8; }
    63% { transform: perspective(190px) rotateY(90deg); opacity: 0; }
    66% { transform: perspective(190px) rotateY(270deg); opacity: 0; }
    68% { transform: perspective(190px) rotateY(315deg); opacity: .8; }
    71%, 100% { transform: perspective(190px) rotateY(360deg); opacity: 1; }
  }
  @keyframes gleam { 0%, 34% { transform: translateX(-70px); } 58%, 100% { transform: translateX(130px); } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#25261d"/><stop offset="1" stop-color="#0d0e09"/>
  </linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="clip"><rect x="0" y="0" width="96" height="96" rx="22"/></clipPath>
</defs>
<rect x="0.5" y="0.5" width="95" height="95" rx="21.5" fill="url(#bg)" stroke="#34352a"/>
<g clip-path="url(#clip)">
  <rect x="1" y="1" width="94" height="46" rx="20" fill="url(#sheen)"/>
  <rect x="1" y="52" width="94" height="43" rx="18" fill="#000000" opacity=".22"/>
  <g transform="rotate(16 48 48)"><rect class="gleam" x="-46" y="-40" width="18" height="180" fill="#ffffff" opacity=".09"/></g>
  <g class="float"><g class="spin"><g transform="translate(22 22) scale(2.1667)" fill="#009688"><path d="M12 .0387C5.3729.0384.0003 5.3931 0 11.9988c-.001 6.6066 5.372 11.9628 12 11.9625 6.628.0003 12.001-5.3559 12-11.9625-.0003-6.6057-5.3729-11.9604-12-11.96m-.829 5.4153h7.55l-7.5805 5.3284h5.1828L5.279 18.5436q2.9466-6.5444 5.892-13.0896"/></g></g></g>
</g>
<rect x="0.5" y="0.5" width="95" height="95" rx="21.5" fill="none" stroke="#eaf3ff" stroke-opacity=".07"/>
<text x="48" y="112" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9aa4b4">FastAPI</text>
</svg>
