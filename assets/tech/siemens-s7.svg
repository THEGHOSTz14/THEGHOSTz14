<svg xmlns="http://www.w3.org/2000/svg" width="96" height="118" viewBox="0 0 96 118" role="img" aria-label="Siemens S7">
<!-- t6 -->
<style>
  .float { animation: float 6.4s ease-in-out infinite; animation-delay: -7.90s; }
  .spin { transform-box: fill-box; transform-origin: 50% 50%; animation: spin 10s linear infinite; animation-delay: -7.90s; }
  .gleam { animation: gleam 10s ease-in-out infinite; animation-delay: -7.90s; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
  @keyframes spin {
    0%, 58% { transform: perspective(190px) rotateY(0deg); opacity: 1; }
    61% { transform: perspective(190px) rotateY(45deg); opacity: .8; }
    63% { transform: perspective(190px) rotateY(90deg); opacity: 0; }
    66% { transform: perspective(190px) rotateY(270deg); opacity: 0; }
    68% { transform: perspective(190px) rotateY(315deg); opacity: .8; }
    71%, 100% { transform: perspective(190px) rotateY(360deg); opacity: 1; }
  }
  @keyframes gleam { 0%, 34% { transform: translateX(-70px); } 58%, 100% { transform: translateX(130px); } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#25261d"/><stop offset="1" stop-color="#0d0e09"/>
  </linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="clip"><rect x="0" y="0" width="96" height="96" rx="22"/></clipPath>
</defs>
<rect x="0.5" y="0.5" width="95" height="95" rx="21.5" fill="url(#bg)" stroke="#34352a"/>
<g clip-path="url(#clip)">
