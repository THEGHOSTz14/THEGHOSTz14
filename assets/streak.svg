<svg xmlns="http://www.w3.org/2000/svg" width="360" height="150" viewBox="0 0 360 150" role="img" aria-label="Contribution streak">
<!-- k1 -->
<style>
  .sweep { animation: sweep 5.4s linear infinite; }
  @keyframes sweep { 0% { transform: translateX(-70px); } 100% { transform: translateX(380px); } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#141414"/><stop offset="1" stop-color="#0a0a0a"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#dcdcdc" stop-opacity=".1"/><stop offset=".5" stop-color="#dcdcdc" stop-opacity=".85"/><stop offset="1" stop-color="#dcdcdc" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="card"><rect x="0.5" y="0.5" width="359" height="149" rx="14"/></clipPath>
</defs>
<rect x="0.5" y="0.5" width="359" height="149" rx="14" fill="url(#bg)" stroke="#3a3a3a"/>
<rect x="0.5" y="0.5" width="359" height="2.5" rx="1" fill="url(#edge)"/>
<g clip-path="url(#card)">
  <rect class="sweep" x="0" y="0" width="38" height="150" fill="#ffffff" opacity=".045"/>
</g>
<text x="32" y="58" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#f0f0f0">0</text>
<text x="32" y="76" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" fill="#9a9a9a" letter-spacing=".4">day current streak</text>
<text x="32" y="90" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="9" fill="#737373">no run yet</text>
<text x="200" y="58" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#f0f0f0">11</text>
<text x="200" y="76" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" fill="#9a9a9a" letter-spacing=".4">day longest streak</text>
<text x="200" y="90" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="9" fill="#737373">23 Oct - 02 Nov</text>
<text x="32" y="112" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#f0f0f0">125</text>
<text x="32" y="130" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" fill="#9a9a9a" letter-spacing=".4">contributions</text>
<text x="32" y="144" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="9" fill="#737373">all time</text>
<text x="200" y="112" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#f0f0f0">14</text>
<text x="200" y="130" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" fill="#9a9a9a" letter-spacing=".4">active days</text>
<text x="200" y="144" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="9" fill="#737373">since 20 Mar 2025</text>
</svg>
